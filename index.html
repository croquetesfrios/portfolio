    (() => {
      const setup = () => {
        const root = document.querySelector('.idx');
        if (!root) {
          if (window.__portfolioBackgroundObserver) window.__portfolioBackgroundObserver.disconnect();
          window.__portfolioBackgroundObserver = null;
          return;
        }

        const sincronizarVideos = () => {
          root.querySelectorAll('.layer').forEach((layer) => {
            const videoAtivo = layer.classList.contains('on')
              ? layer.querySelector('video.bgi.on')
              : null;

            layer.querySelectorAll('video.bgi').forEach((video) => {
              if (video === videoAtivo) {
                const reproducao = video.play();
                if (reproducao && typeof reproducao.catch === 'function') reproducao.catch(() => {});
              } else {
                video.pause();
              }
            });
          });
        };

        root.querySelectorAll('video.bgi').forEach((video) => {
          video.onended = () => video.dispatchEvent(new CustomEvent('portfolio:background-ended', { bubbles: true }));
        });

        if (window.__portfolioBackgroundObserver) window.__portfolioBackgroundObserver.disconnect();
        window.__portfolioBackgroundObserver = new MutationObserver(sincronizarVideos);
        // Observa as camadas e os fundos: nav.js também troca .on entre imagens/vídeos.
        window.__portfolioBackgroundObserver.observe(root, {
          attributes: true,
          attributeFilter: ['class'],
          subtree: true,
        });
        sincronizarVideos();
      };

      // Astro dispara este evento após a carga inicial e após navegação com View Transitions.
      if (!window.__portfolioBackgroundListener) {
        document.addEventListener('astro:page-load', setup);
        window.__portfolioBackgroundListener = true;
      }
    })();
  </script><section class="pg sobre" id="sobre"><p>Fotografia, vídeo e web dev. <br> Licenciado em Audiovisual e Multimédia na Escola Superior de Comunicação Social.</p></section><section class="pg contacto" id="contacto"><p>Vamos falar?<br><a href="mailto:jvsmendes@outlook.pt">jvsmendes@outlook.pt</a></p></section></main><footer><div class="more"><div class="fcols"><div><p class="fbig">João Mendes</p><p>Fotografia, vídeo, design e web dev.</p></div><div class="ls"><a href="#" id="totop">Voltar ao topo</a></div></div></div><div class="frow"><span>© 2026 João Mendes</span><span class="temas"><button type="button" data-t="neo" onclick="setTema(this.dataset.t)">Neo-Grotesco</button><button type="button" data-t="minimalista" onclick="setTema(this.dataset.t)">Minimalista</button><button type="button" data-t="editorial" onclick="setTema(this.dataset.t)">Editorial</button><button type="button" data-t="mono" onclick="setTema(this.dataset.t)">Mono</button></span></div></footer><script type="module" src="/_astro/Base.astro_astro_type_script_index_0_lang.CZUnQwx8.js"></script></body></html>
